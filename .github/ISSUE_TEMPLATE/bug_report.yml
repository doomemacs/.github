---
name: 📝 Bug report
description: Report a bug, error, or misbehavior
type: bug
labels: ["needs-triage"]
projects: ["doomemacs/2"]
body:
- type: markdown
  attributes:
    value: |
      > [!IMPORTANT]
      > Before you fill out this bug report, please be aware of the following:
      >
      > - This is not the place for feature requests, general user support, PSAs, or discussions/RFCs. Post those on [our Github Discussions](https://discuss.doomemacs.org) or [our Discord server](https://discuss.doomemacs.org) instead — whichever you prefer.
      > - Make sure your issue is in the correct repo! If you aren't sure, post your issue on [our Github Discussions forum](https://discuss.doomemacs.org) instead.
      > - Make sure your issue hasn't already been reported: search the issue tracker, [documentation](https://docs.doomemacs.org), [FAQ](https://doomemacs.org/faq), [discussion board](https://discuss.doomemacs.org), and [Google](https://google.com).
      > - Consult [the debugging guide](https://discourse.doomemacs.org/t/55) for ways to investigate your issue.
      > - Include [backtraces](https://discourse.doomemacs.org/t/85) for any error messages.
      >
      > Bug reports that are unactionable, vague, or too broad (or are otherwise unhelpful to posterity) **will be closed and queued for deletion**, with notice. Please understand that this project gets *many* false positives and open-ended bug reports that we lack the manpower to investigate at length. Keeping them around only pollutes search results; making it harder to find and follow legitimate issues.
- type: textarea
  attributes:
    label: Describe your issue
    description: |
      Include as much information as possible. Such as:

      - **A [backtrace](https://discourse.doomemacs.org/t/85) for any error messages.**
      - Any recent errors/warnings in the \*Messages\* buffer (`C-h e` to open it).
      - Better explanations than "X does not work".
      - Any attempts you made to resolve the issue yourself, and their result.
      - Screenshots or screencasts, if possible.
      - Please disclose what parts are written by AI.

      **Please format code and large text dumps with [code fences](https://docs.github.com/en/github/writing-on-github/creating-and-highlighting-code-blocks) or use [pastebin](https://pastebin.com) (or similar).**
    placeholder: |
      When I do X, it should do Y, but it does Z instead, which throws an error. Here is the backtrace:

      ```
      Debugger entered--Lisp error: (error "Beep Boop")
        error("Beep Boop")
        pp-eval-expression((error "Beep Boop"))
        \#<subr funcall-interactively>(pp-eval-expression (error "Beep Boop"))
        apply(#<subr funcall-interactively> (pp-eval-expression (error "Beep Boop")))
        funcall-interactively(pp-eval-expression (error "Beep Boop"))
      ```
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps to reproduce
    placeholder: |
      1. Open Emacs,
      2. `M-x doom/info` and be prompted to visit pastebin.com,
      3. Press `y` to open pastebin.com in browser,
      4. Paste the contents of my clipboard into text box,
      5. Click "Create New Paste,"
      6. Post it in the "System information" text box below.
  validations:
    required: true
- type: upload
  attributes:
    label: System information
    description: |
      Upload the output of `M-x doom/info`, `$EMACSDIR/bin/doom info`, or [this elisp script](https://gist.github.com/hlissner/7733d13dec09746ea044e2bef98424cb) here. Include any pertinent logs files here too, if necessary.
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Disclosures
    description:
      Check off any that apply to help us assess your issue(s) more accurately.
    options:
      - label: This issue was written with/by AI.
- type: markdown
  attributes:
    value: |
      -----

      :heart: **Thank you for taking the time to file this bug report!**
